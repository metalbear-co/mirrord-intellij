name: Changelog Update

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to publish. Empty selects the latest published release tag."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Source ref to publish. Empty selects the latest published release tag."
        required: false
        type: string
        default: ""
    secrets:
      CUBBY_CLIENT_ID:
        required: true
      CUBBY_PRIVATE_KEY:
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token (docs-changelog repo)
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          owner: metalbear-co
          repositories: docs-changelog
          permission-contents: write
      - name: Prepare changelog to be published at /docs/changelog
        uses: metalbear-co/release-changelog-docs@747e23c4fbb265ddd583a37e709549e1dbfc4e60
        with:
          ref: ${{ inputs.ref }}
          source_token: ${{ github.token }}
          local_file_path: ./CHANGELOG.md
          public_source_url: https://github.com/metalbear-co/mirrord-intellij
          destination_repo: metalbear-co/docs-changelog
          destination_file_path: ./changelog/mirrord-intellij.md
          git_user: cubby-mb[bot]
          git_email: 273354325+cubby-mb[bot]@users.noreply.github.com
          git_access_token: ${{ steps.app-token.outputs.token }}
          title: IntelliJ Changelog
          description: The release changelog for the mirrord IntelliJ plugin.
          tags: oss,team,enterprise
