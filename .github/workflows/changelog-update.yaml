name: Changelog Update

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref to publish. Empty selects the latest published release tag."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Source ref to publish. Empty selects the latest published release tag."
        required: false
        type: string
        default: ""
    secrets:
      CHANGELOG_PAT:
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Prepare changelog to be published at /docs/changelog
        uses: metalbear-co/release-changelog-docs@8415b309ebe9baac53f03372c21138b01927793f
        with:
          ref: ${{ inputs.ref }}
          source_token: ${{ github.token }}
          local_file_path: ./CHANGELOG.md
          destination_repo: metalbear-co/docs-changelog
          destination_file_path: ./changelog/mirrord-intellij.md
          git_user: cubby-mb[bot]
          git_email: 273354325+cubby-mb[bot]@users.noreply.github.com
          git_access_token: ${{ secrets.CHANGELOG_PAT }}
          title: IntelliJ Changelog
          description: The release changelog for the mirrord IntelliJ plugin.
          tags: oss,team,enterprise
