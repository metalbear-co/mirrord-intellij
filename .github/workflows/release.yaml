name: Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  validate_release_request:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Avoid persisting GITHUB_TOKEN credentials in release jobs.
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Validate release trigger and version
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(grep -oP '(?<=pluginVersion = )[\d.]+' gradle.properties)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            case "${{ github.event.pull_request.head.ref }}" in
              release/*|releases/*)
                ;;
              *)
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          release_status_code=$(
            curl -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o /tmp/release-check.json \
              -w "%{http_code}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${version}"
          )

          if [ "${release_status_code}" = "200" ]; then
            echo "Version ${version} is already released."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${release_status_code}" != "404" ]; then
            cat /tmp/release-check.json
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: validate_release_request
    if: github.event_name == 'workflow_dispatch' || needs.validate_release_request.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Avoid persisting GITHUB_TOKEN credentials in release jobs.
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Get version
        id: version
        run: |
          echo "version=$(grep -oP '(?<=pluginVersion = )[\d.]+' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: get custom delve
        run: |
          mkdir -p bin/macos/arm64
          mkdir -p bin/macos/x86-64
          wget https://github.com/metalbear-co/delve/releases/download/1.20.1/delve_darwin_arm64 -O bin/macos/arm64/dlv
          wget https://github.com/metalbear-co/delve/releases/download/1.20.1/delve_darwin_amd64 -O bin/macos/x86-64/dlv
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
      - name: Build Plugin
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.INTELLIJ_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.INTELLIJ_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.INTELLIJ_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.INTELLIJ_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew publishPlugin
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: intellij-ext
          path: build/distributions/mirrord-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release_gh:
    needs: [validate_release_request, release]
    runs-on: ubuntu-24.04
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Avoid persisting GITHUB_TOKEN credentials in release jobs.
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intellij-ext
          path: /tmp/release
      - uses: metalbear-co/action-zip@0852c26906e00f8a315c704958823928d8018b28 # default branch HEAD
      - name: Create app token for release publishing
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-contents: write
      - name: Prepare release notes
        run: |
          set -euo pipefail

          version='${{ needs.release.outputs.version }}'

          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Release
        uses: metalbear-co/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # default branch HEAD
        with:
          body_path: /tmp/release-notes.md
          tag_name: ${{ needs.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          token: ${{ steps.app_token.outputs.token }}
          files: /tmp/release/**

  update_latest:
    runs-on: ubuntu-24.04
    needs: [validate_release_request, release_gh]
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Avoid persisting GITHUB_TOKEN credentials in release jobs.
          persist-credentials: false
          # Get complete history
          fetch-depth: 0

      - name: Create app token for tag updates
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-contents: write

      - name: Update major version and latest tags
        uses: metalbear-co/release-tracker-action@419810f4dfc58850fb70c8cb908ec66df1e377e5 # default branch HEAD
        env:
          # GitHub App token to enable pushing tags
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          # Move "latest" tag
          update-latest: true
          # Don't update the vX.Y tags
          update-minor: false

  update_infra_jetbrains_version:
    runs-on: ubuntu-24.04
    needs: [validate_release_request, release, update_latest]
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - name: Create app token for infra workflow dispatch
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          owner: metalbear-co
          repositories: infra
          permission-actions: write

      - name: Dispatch infra update-jetbrains-version workflow
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            repos/metalbear-co/infra/actions/workflows/update-vscode-version.yml/dispatches \
            -f ref=main \
            -f inputs[jetbrains_version]=${{ needs.release.outputs.version }}

  linear_release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: [validate_release_request, update_latest]
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Required for commit history

      - uses: metalbear-co/linear-release-action@76a250988b9470b152ec13d24d661140084042c1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ needs.validate_release_request.outputs.version }}
